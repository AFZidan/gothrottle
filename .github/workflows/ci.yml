name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.20', '1.21', '1.22']
        redis-version: [6, 7]

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Remove old Go
      run: |
        sudo rm -rf /usr/local/go
        sudo rm -rf /opt/hostedtoolcache/go/1.2.2

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - name: Verify Go installation
      run: |
        echo "Expected Go version: ${{ matrix.go-version }}"
        echo "Actual Go version: $(go version)"
        echo "Go root: ${GOROOT:-not set}"
        echo "Go path: ${GOPATH:-not set}"
        echo "Which go: $(which go)"
        echo "PATH: $PATH"
        
        # Verify we have go modules support
        if ! go help mod >/dev/null 2>&1; then
          echo "ERROR: Go modules not supported in this Go version"
          go help
          exit 1
        fi
        echo "✓ Go modules supported"
        
        # Verify minimum Go version for modules
        GO_VERSION=$(go version | cut -d' ' -f3 | cut -d'.' -f1-2 | sed 's/go//')
        if [ "$(printf '%s\n' "1.11" "$GO_VERSION" | sort -V | head -n1)" != "1.11" ]; then
          echo "ERROR: Go version $GO_VERSION is too old for modules (requires >= 1.11)"
          exit 1
        fi

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted properly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Wait for Redis
      shell: bash
      run: |
        # The service container is already health-checked, but verify the
        # mapped port answers from the job so a silent Redis failure surfaces
        # here rather than as a skipped test.
        for i in $(seq 1 30); do
          if (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; then
            echo "✓ Redis is reachable on localhost:6379"
            exit 0
          fi
          echo "Waiting for Redis... ($i/30)"
          sleep 1
        done
        echo "ERROR: Redis did not become reachable at localhost:6379"
        exit 1

    - name: Run tests
      # shell: bash sets -o pipefail so a test failure is not masked by tee.
      shell: bash
      env:
        REDIS_ADDR: localhost:6379
        REQUIRE_REDIS: "true"
      run: go test -v -race -coverprofile=coverage.out -coverpkg=./... ./tests/... 2>&1 | tee test-output.txt

    - name: Fail if Redis tests skipped
      shell: bash
      run: |
        if grep -qE '^\s*--- SKIP: TestRedis' test-output.txt; then
          echo "ERROR: Redis integration tests were skipped even though Redis was required:"
          grep -E '^\s*--- SKIP: TestRedis' test-output.txt
          exit 1
        fi
        redis_tests=$(grep -cE '^\s*--- PASS: TestRedis' test-output.txt || true)
        if [ "$redis_tests" -lt 1 ]; then
          echo "ERROR: no Redis integration tests reported PASS; Redis coverage is missing"
          grep -E 'TestRedis' test-output.txt || echo "(no TestRedis output at all)"
          exit 1
        fi
        echo "✓ $redis_tests Redis integration test(s) executed against Redis ${{ matrix.redis-version }}"

    - name: Run benchmarks
      env:
        REDIS_ADDR: localhost:6379
        REQUIRE_REDIS: "true"
      run: go test -bench=. -benchmem -run '^$' ./tests/...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: false

    - name: Verify Go installation
      run: |
        echo "Expected Go version: 1.22"
        echo "Go version: $(go version)"
        # Ensure correct Go is in PATH
        if [ -d "/opt/hostedtoolcache/go/1.22" ]; then
          export GOROOT="/opt/hostedtoolcache/go/1.22/x64"
          export PATH="$GOROOT/bin:$PATH"
          echo "GOROOT=$GOROOT" >> $GITHUB_ENV
          echo "$GOROOT/bin" >> $GITHUB_PATH
        fi

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.22-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.22-
          ${{ runner.os }}-go-

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        # Pinned deliberately: `latest` makes CI results depend on when it ran,
        # so a new linter release can break an unchanged commit.
        version: v1.59.1
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: false

    - name: Verify Go installation
      run: |
        echo "Expected Go version: 1.22"
        echo "Go version: $(go version)"
        # Ensure correct Go is in PATH
        if [ -d "/opt/hostedtoolcache/go/1.22" ]; then
          export GOROOT="/opt/hostedtoolcache/go/1.22/x64"
          export PATH="$GOROOT/bin:$PATH"
          echo "GOROOT=$GOROOT" >> $GITHUB_ENV
          echo "$GOROOT/bin" >> $GITHUB_PATH
        fi

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.22-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.22-
          ${{ runner.os }}-go-

    - name: Run Gosec Security Scanner
      env:
        # Pinned deliberately: see the golangci-lint note in the lint job.
        GOSEC_VERSION: v2.20.0
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
        gosec ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: false

    - name: Verify Go installation
      run: |
        echo "Expected Go version: 1.22"
        echo "Go version: $(go version)"
        # Ensure correct Go is in PATH
        if [ -d "/opt/hostedtoolcache/go/1.22" ]; then
          export GOROOT="/opt/hostedtoolcache/go/1.22/x64"
          export PATH="$GOROOT/bin:$PATH"
          echo "GOROOT=$GOROOT" >> $GITHUB_ENV
          echo "$GOROOT/bin" >> $GITHUB_PATH
        fi

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.22-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.22-
          ${{ runner.os }}-go-

    - name: Build
      run: go build -v ./...

    - name: Test build for different OS/ARCH
      # CGO_ENABLED=0 explicitly: Go defaults it to 0 when cross-compiling only
      # if the environment has not set it, and the sqlite3-backed tests need
      # CGO_ENABLED=1. Keep in sync with the Makefile's cross-build target.
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
