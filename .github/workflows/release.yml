name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.22

    - name: Run tests
      # Releases must not be cut from a tree whose Redis tests never ran.
      env:
        REDIS_ADDR: localhost:6379
        REQUIRE_REDIS: "true"
      run: go test -v -race ./tests/...

    - name: Create Release Notes
      run: |
        echo "## What's Changed" > release_notes.md
        echo "" >> release_notes.md
        echo "See the [CHANGELOG.md](CHANGELOG.md) for detailed changes." >> release_notes.md
        echo "" >> release_notes.md
        echo "## Installation" >> release_notes.md
        echo "" >> release_notes.md
        echo '```bash' >> release_notes.md
        echo "go get github.com/AFZidan/gothrottle@${{ github.ref_name }}" >> release_notes.md
        echo '```' >> release_notes.md

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "Release ${{ github.ref_name }}" \
          --notes-file release_notes.md

  update-go-pkg:
    name: Update Go Package Registry
    runs-on: ubuntu-latest
    needs: release
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.22

    - name: Trigger Go proxy
      run: |
        # -x would set a proxy to route through; the intent is a plain GET that
        # warms the module proxy cache for this tag.
        curl -fsSL "https://proxy.golang.org/github.com/AFZidan/gothrottle/@v/${{ github.ref_name }}.info"
