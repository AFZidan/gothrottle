name: Release

# One authoritative release path.
#
# The previous design was tag-triggered: pushing a tag ran the tests and then
# created the release. That inverted the gate. By the time the workflow started
# the tag already existed and could already be resolved by the Go module proxy,
# so a failing verification step could not stop a release — only report on one
# that had already happened. And when the release had also been created by hand,
# `gh release create` failed on "already exists" and took the dependent Go proxy
# warm-up down with it. That is exactly how the v1.1.0 run went red.
#
# Verification now runs before the tag exists. The tag is created from the
# verified commit only after every check passes, and the release is created from
# that tag. Nothing is published while verification could still fail.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version tag to release, e.g. v1.1.1'
        required: true
        type: string
      commit:
        description: 'Exact commit SHA to release. Defaults to the current tip of main.'
        required: false
        type: string
      dry_run:
        description: 'Verify only: create no tag and no release.'
        required: false
        type: boolean
        default: false

# Least privilege. Only the job that creates the tag and the release needs write
# access to repository contents, and it is granted there rather than here.
permissions:
  contents: read

# Two releases must never run at once: both could resolve "the tip of main" to
# different commits and race to create tags. In-progress runs are not cancelled —
# a cancelled run could leave a tag with no release — so a second attempt waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    # Read-only, but wider than the workflow default: a workflow-level
    # `permissions:` block sets every scope it omits to none, and this job needs
    # the Actions API (to identify its own check suite), the Checks API and commit
    # statuses.
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_exists: ${{ steps.existing.outputs.release_exists }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: proving a commit is an ancestor of main is impossible
          # in a shallow clone.
          fetch-depth: 0

      - name: Fetch main and tags
        run: |
          # Explicit rather than relying on what checkout happens to fetch, since
          # the ancestry and existing-tag checks below both depend on these refs.
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --force --tags origin

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Strict semver with a leading v, optional pre-release and build
          # metadata. Go module versions must carry the v, and a malformed tag is
          # a permanent artifact once pushed.
          if ! printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not a valid semantic version tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "OK: $VERSION is a valid semantic version tag"

      - name: Resolve and verify commit
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_COMMIT" ]; then
            if ! sha=$(git rev-list -n 1 "$REQUESTED_COMMIT" 2>/dev/null); then
              echo "::error::commit '$REQUESTED_COMMIT' does not resolve to a commit in this repository"
              exit 1
            fi
          else
            sha=$(git rev-list -n 1 refs/remotes/origin/main)
            echo "No commit supplied; using the current tip of main."
          fi

          # A release must be reachable from main. Releasing an unmerged commit
          # publishes code that no branch protection or review ever gated.
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::commit $sha is not an ancestor of main; only commits merged to main may be released"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "OK: releasing $VERSION from $sha (contained in main)"

      - name: Inspect existing tag and release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          # An existing tag is acceptable only if it already points at the commit
          # being released — the re-run case. Pointing elsewhere means the request
          # disagrees with published history, and moving the tag would silently
          # change what `go get` at that version resolves to. That is an error,
          # not something to reconcile.
          if tagged=$(git rev-list -n 1 "refs/tags/$VERSION" 2>/dev/null); then
            if [ "$tagged" != "$SHA" ]; then
              echo "::error::tag $VERSION already exists at $tagged but $SHA was requested. Refusing to move a published tag; release a new version instead."
              exit 1
            fi
            echo "Tag $VERSION already exists at the requested commit; it will be reused, never moved."
          fi

          # An existing release is reported, not treated as a failure: the old
          # workflow died here on "already exists" and skipped the Go proxy
          # warm-up that depended on it.
          release_exists=false
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            release_exists=true
            echo "Release $VERSION already exists; it will be inspected rather than recreated."
          fi
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          # The commit's own CI must have finished successfully. The suite is
          # re-run below, but that says nothing about lint, the security scan,
          # CodeQL or the Go 1.19-1.22 matrix, none of which are repeated here.
          #
          # This release run's own check runs are excluded by check-suite id:
          # when the release commit is the tip of main, this very job appears in
          # the list as in_progress and would otherwise block itself.
          own_suite=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.check_suite_id')
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [(.check_suite.id | tostring), .name, .status, (.conclusion // "pending")] | @tsv')

          others=$(printf '%s\n' "$checks" | awk -F'\t' -v own="$own_suite" 'NF && $1 != own')
          if [ -z "$others" ]; then
            echo "::error::no CI check runs found for $SHA; CI must run on a commit before it is released"
            exit 1
          fi

          printf '%s\n' "$others" | awk -F'\t' '{printf "  %s: %s/%s\n", $2, $3, $4}'
          unhealthy=$(printf '%s\n' "$others" | awk -F'\t' '$3 != "completed" || ($4 != "success" && $4 != "neutral" && $4 != "skipped")')
          if [ -n "$unhealthy" ]; then
            echo "::error::commit $SHA has check runs that are not successful:"
            printf '%s\n' "$unhealthy" | awk -F'\t' '{printf "  %s: %s/%s\n", $2, $3, $4}'
            exit 1
          fi

          # Commit statuses are a separate mechanism from check runs; some tools
          # (coverage reporters, for example) still use them.
          status_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '"\(.state) \(.total_count)"')
          echo "  combined commit status: $status_state"
          case "$status_state" in
            failure*|error*)
              echo "::error::commit $SHA has a failing commit status"
              exit 1
              ;;
          esac
          echo "OK: every check run for $SHA is successful"

      - name: Check out the release commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # Everything below must test the exact commit being released, not
          # whatever main has moved on to since.
          git checkout --detach "$SHA"
          git --no-pager log -1 --oneline

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Verify the module version is declarable
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # A v2+ tag needs a matching module path suffix. Publishing v2.0.0 from
          # a module declared as v1 yields a version the proxy serves but `go get`
          # cannot resolve.
          module=$(go list -m)
          major=${VERSION%%.*}
          major=${major#v}
          case "$major" in
            0|1)
              if printf '%s' "$module" | grep -Eq '/v[0-9]+$'; then
                echo "::error::module path $module carries a major-version suffix but $VERSION is v$major"
                exit 1
              fi
              ;;
            *)
              if [ "${module##*/}" != "v$major" ]; then
                echo "::error::releasing $VERSION requires the module path to end in /v$major, but it is $module"
                exit 1
              fi
              ;;
          esac
          echo "OK: module $module can be released as $VERSION"

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "::error::these files are not gofmt -s clean:"
            gofmt -s -l .
            exit 1
          fi

      - name: Wait for Redis
        shell: bash
        run: |
          # The service container is health-checked, but verify the mapped port
          # answers from the job so a silent Redis failure surfaces here rather
          # than as a skipped test.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/6379) 2>/dev/null; then
              echo "OK: Redis is reachable on localhost:6379"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 1
          done
          echo "::error::Redis did not become reachable at localhost:6379"
          exit 1

      - name: Run race tests against Redis
        shell: bash
        env:
          REDIS_ADDR: localhost:6379
          # A release must never be cut from a tree whose Redis tests skipped.
          REQUIRE_REDIS: 'true'
        run: go test -v -race ./tests/... 2>&1 | tee release-test-output.txt

      - name: Confirm Redis tests executed
        shell: bash
        run: |
          if grep -qE '^\s*--- SKIP: TestRedis' release-test-output.txt; then
            echo "::error::Redis integration tests skipped during release verification:"
            grep -E '^\s*--- SKIP: TestRedis' release-test-output.txt
            exit 1
          fi
          redis_tests=$(grep -cE '^\s*--- PASS: TestRedis' release-test-output.txt || true)
          if [ "$redis_tests" -lt 1 ]; then
            echo "::error::no Redis integration test reported PASS; Redis coverage is missing from this release"
            exit 1
          fi
          echo "OK: $redis_tests Redis integration test(s) executed"

      - name: Cross-platform build
        run: |
          # CGO_ENABLED=0 explicitly: Go only defaults it to 0 when
          # cross-compiling if the environment has not already set it.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          echo "Dry run complete. $VERSION would have been released from $SHA; no tag and no release were created."

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ !inputs.dry_run }}
    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main and tags
        run: |
          # The workflow can be dispatched from any ref, so the commit being
          # released is not guaranteed to be in the checked-out history.
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --force --tags origin

      - name: Create the tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail

          # Verification already proved any existing tag points at this commit,
          # so this is either the first push or a no-op re-run. Never --force:
          # moving a published tag changes what an already-resolved module
          # version means to every consumer that cached it.
          #
          # ls-remote also returns the peeled `^{}` ref for an annotated tag, so
          # only the first line is of interest.
          existing=$(git ls-remote --tags origin "refs/tags/$VERSION" | awk 'NR==1 {print $1}')
          if [ -n "$existing" ]; then
            echo "Tag $VERSION is already on origin at $existing; leaving it untouched."
            exit 0
          fi

          # An annotated tag needs a committer identity, and actions/checkout does
          # not configure one. Set it locally rather than globally so nothing else
          # in the job inherits it.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag -a "$VERSION" "$SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "OK: tagged $SHA as $VERSION"

      - name: Build release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          {
            echo "## What's Changed"
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for the detailed list of changes."
            echo
            echo "## Installation"
            echo
            echo '```bash'
            echo "go get github.com/AFZidan/gothrottle@${VERSION}"
            echo '```'
            echo
            echo "Released from commit \`${SHA}\`, verified against Redis with the race detector enabled."
          } > release_notes.md

      - name: Create or inspect the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_EXISTS: ${{ needs.verify.outputs.release_exists }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_EXISTS" = 'true' ]; then
            # Idempotent by design: a re-run after a partial failure must reach
            # the Go proxy warm-up rather than dying on "already exists". The
            # existing body is left alone, since it may have been edited
            # deliberately.
            echo "Release $VERSION already exists; inspecting it."
            gh release view "$VERSION"
            exit 0
          fi

          # --target takes a branch or a full commit SHA, so it is the verified
          # SHA rather than the tag name. The tag already exists at that commit,
          # so this only names where the release points if the tag were somehow
          # absent.
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "Release $VERSION" \
            --notes-file release_notes.md
          echo "OK: created release $VERSION"

  warm-go-proxy:
    name: Warm the Go module proxy
    runs-on: ubuntu-latest
    needs: [verify, publish]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Request the module version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # A plain GET is what populates the proxy cache. `curl -x` sets a proxy
          # to route *through*, which is what this step used to do by mistake.
          #
          # The module path is lowercased because the proxy escapes uppercase
          # letters as !<letter>; requesting the mixed-case path 404s forever.
          #
          # The proxy fetches asynchronously, so the first request can 404 while
          # it works. Retry before treating that as a problem, and warn rather
          # than fail: the release itself is already published and correct.
          for attempt in $(seq 1 10); do
            if curl -fsSL "https://proxy.golang.org/github.com/afzidan/gothrottle/@v/${VERSION}.info"; then
              echo
              echo "OK: proxy.golang.org serves ${VERSION}"
              exit 0
            fi
            echo "Proxy has not indexed ${VERSION} yet (attempt ${attempt}/10); retrying in 15s."
            sleep 15
          done
          echo "::warning::proxy.golang.org did not serve ${VERSION} within the retry window; it usually appears within a few minutes of the first fetch."
