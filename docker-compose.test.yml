services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis:6379
      # Fail rather than skip if Redis is unreachable from the container.
      - REQUIRE_REDIS=true
    volumes:
      - .:/app
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    command: make ci

volumes:
  go-build-cache:
